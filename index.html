<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>计量经济学 · 章节测试答题本</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/newsreader@5.2.10/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-sc@5.2.10/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-serif-sc@5.2.10/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.2.8/index.css" rel="stylesheet">
<style>
:root{
  --paper:#F5F2EA; --paper-2:#EFEBE0; --surface:#FFFFFF;
  --ink:#1B2126; --ink-2:#3C444B; --muted:#7A7570; --line:#DCD6C9; --line-2:#EAE5DA;
  --accent:#1D5B79; --accent-soft:#E4EEF2;
  --ok:#2C6A4E; --ok-soft:#E6F0EA;
  --no:#A03A2C; --no-soft:#F8E9E6;
  --warn:#8A6A1F; --warn-soft:#F6EFDC;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(27,33,38,.05), 0 8px 24px -16px rgba(27,33,38,.18);
  --font-display:"Newsreader Variable","Noto Serif SC","Songti SC",STSong,serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono Variable",ui-monospace,SFMono-Regular,Menlo,monospace;
  --measure:74rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.75;
  font-synthesis:none; line-break:strict; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(0deg,rgba(27,33,38,.028) 1px,transparent 1px);
  background-size:100% 30px;
}
::selection{background:#D8E6EC}
h1,h2,h3{margin:0; font-family:var(--font-display); font-weight:600; line-height:1.3}
button{font:inherit; color:inherit; cursor:pointer}
input{font:inherit; color:inherit}

/* ---------- shell ---------- */
.wrap{position:relative; z-index:1; max-width:var(--measure); margin:0 auto; padding:0 24px 96px}

/* masthead */
.mast{border-bottom:1px solid var(--line); padding:34px 0 26px; display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end}
.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:10px}
h1{font-size:clamp(30px,4.4vw,46px); letter-spacing:-.01em; text-wrap:balance}
h1 em{font-style:normal; color:var(--accent)}
.mast p{margin:10px 0 0; color:var(--muted); font-size:14.5px; max-width:46em}
.mast-meta{text-align:right; font-size:12px; font-family:var(--font-mono); color:var(--muted); line-height:2}
.mast-meta b{display:block; font-family:var(--font-display); font-size:26px; color:var(--ink); letter-spacing:-.01em}

/* toolbar */
.bar{position:sticky; top:0; z-index:20; background:rgba(245,242,234,.93); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); margin:0 -24px; padding:10px 24px; display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.chips{display:flex; gap:6px; overflow-x:auto; scrollbar-width:thin; padding:2px 0; flex:1 1 auto; min-width:0}
.chip{flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px; font-size:13px; white-space:nowrap; display:flex; align-items:center; gap:7px; transition:.16s}
.chip .n{font-family:var(--font-mono); font-size:11px; color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.7)}
.chip:hover{border-color:var(--accent)}
.bar-actions{display:flex; gap:8px; flex:0 0 auto}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:13px; transition:.16s; white-space:nowrap}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:#fff}
.btn.primary:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line); color:inherit}

/* chapter header */
.chead{padding:40px 0 22px; display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:start}
.cno{font-family:var(--font-display); font-size:clamp(52px,8vw,84px); line-height:.82; color:var(--line); letter-spacing:-.04em; font-variant-numeric:lining-nums}
.chead h2{font-size:clamp(24px,3.2vw,34px)}
.chead .sub{margin:8px 0 0; color:var(--muted); font-size:14px}
.scoreline{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:14px; font-size:13px; color:var(--ink-2)}
.scoreline div{display:flex; align-items:baseline; gap:6px}
.scoreline b{font-family:var(--font-display); font-size:21px; color:var(--ink); font-variant-numeric:tabular-nums}
.scoreline span{color:var(--muted); font-size:12px}
.meter{height:4px; background:var(--line-2); border-radius:2px; overflow:hidden; margin-top:12px; max-width:420px}
.meter i{display:block; height:100%; background:var(--accent); width:0; transition:width .4s}

/* question card */
.q{border:1px solid var(--line); background:var(--surface); border-radius:var(--r-lg); padding:0; margin:0 0 18px; box-shadow:var(--sh); overflow:hidden; scroll-margin-top:80px}
.q-head{display:grid; grid-template-columns:56px 1fr; border-bottom:1px solid var(--line-2)}
.q-gutter{border-right:1px solid var(--line-2); display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 0 14px; background:var(--paper-2)}
.q-gutter .num{font-family:var(--font-mono); font-size:15px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.q-gutter .mk{width:20px; height:20px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:11px; color:var(--muted); background:var(--surface)}
.q-gutter .mk.ok{background:var(--ok); border-color:var(--ok); color:#fff}
.q-gutter .mk.no{background:var(--no); border-color:var(--no); color:#fff}
.q-body{padding:18px 22px 20px}
.q-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; font-size:11.5px; font-family:var(--font-mono); letter-spacing:.04em}
.tag{border:1px solid var(--line); border-radius:4px; padding:2px 7px; color:var(--muted); text-transform:uppercase; font-size:10.5px; letter-spacing:.1em}
.tag.type{background:var(--accent-soft); border-color:#CBDFE7; color:var(--accent)}
.tag.pt{border-color:var(--line-2)}
.stem{font-size:16.5px; line-height:1.85; color:var(--ink)}
.stem p{margin:0 0 8px}
.hint{color:var(--muted); font-size:13px; margin:6px 0 0}

/* options */
.opts{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.opt{display:grid; grid-template-columns:26px 1fr; gap:10px; align-items:start; border:1px solid var(--line); border-radius:var(--r); padding:11px 14px; background:var(--surface); text-align:left; width:100%; transition:.14s; cursor:pointer}
.opt:hover{border-color:var(--accent); background:#FCFDFD}
.opt .k{font-family:var(--font-mono); font-size:12.5px; color:var(--muted); border:1px solid var(--line); border-radius:5px; width:22px; height:22px; display:grid; place-items:center; margin-top:2px}
.opt .t{font-size:15.5px; line-height:1.7}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.sel .k{background:var(--accent); border-color:var(--accent); color:#fff}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.wrong{border-color:var(--no); background:var(--no-soft)}
.opt.wrong .k{background:var(--no); border-color:var(--no); color:#fff}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--line)}
.opt.right[disabled]:hover{border-color:var(--ok)}
.opt.wrong[disabled]:hover{border-color:var(--no)}
.opt .mark{font-size:11px; color:var(--muted); font-family:var(--font-mono); margin-left:8px; white-space:nowrap}

/* judge + fill */
.judge{display:flex; gap:10px; margin-top:16px}
.judge .opt{grid-template-columns:26px 1fr; max-width:220px}
.fills{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.fill-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.fill-row label{font-family:var(--font-mono); font-size:12.5px; color:var(--muted)}
.fill-row input{border:1px solid var(--line); background:#FCFCFB; border-radius:8px; padding:8px 12px; min-width:200px; flex:1 1 200px; max-width:340px}
.fill-row input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.fills .act{margin-top:4px; display:flex; gap:10px; align-items:center}

/* submit row */
.act{display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap}
.act .note{font-size:12.5px; color:var(--muted)}

/* feedback */
.fb{margin:0; border-top:1px dashed var(--line); background:#FCFBF8; padding:20px 22px 22px}
.fb-verdict{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-size:19px; margin-bottom:4px}
.fb-verdict .ic{width:22px;height:22px;border-radius:50%; display:grid; place-items:center; color:#fff; font-size:12px; font-family:var(--font-body)}
.fb.ok .fb-verdict{color:var(--ok)} .fb.ok .ic{background:var(--ok)}
.fb.no .fb-verdict{color:var(--no)} .fb.no .ic{background:var(--no)}
.fb-key{font-size:13px; color:var(--muted); margin-bottom:16px}
.fb-key b{color:var(--ink); font-family:var(--font-mono); letter-spacing:.02em}
.fb-block{margin-top:18px}
.fb-block > h4{margin:0 0 8px; font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:400}
.fb-block p{margin:0 0 8px; font-size:15px; line-height:1.85; color:var(--ink-2)}
.why{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.why li{display:grid; grid-template-columns:24px 1fr; gap:10px; font-size:14.5px; line-height:1.75; color:var(--ink-2); padding:9px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--line-2)}
.why li.is-wrong{border-color:#EFCFC9; background:var(--no-soft)}
.why li.is-right{border-color:#CBDDD2; background:var(--ok-soft)}
.why .kk{font-family:var(--font-mono); font-size:12px; color:var(--muted); padding-top:2px}
.why b{color:var(--ink); font-weight:600}
.why em{font-style:normal; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--no); margin-left:6px}
.why em.g{color:var(--ok)}
.kps{display:flex; flex-wrap:wrap; gap:7px}
.kp{border:1px solid #CBDFE7; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:4px 11px; font-size:12.5px; transition:.14s}
.kp:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
.kp[aria-expanded="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.kp-doc{margin-top:10px; display:flex; flex-direction:column; gap:8px}
.kp-card{border-left:3px solid var(--accent); background:var(--surface); border:1px solid var(--line-2); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:11px 14px}
.kp-card h5{margin:0 0 3px; font-size:14px; font-family:var(--font-display); font-weight:600}
.kp-card .ref{font-family:var(--font-mono); font-size:10.5px; color:var(--accent); letter-spacing:.04em}
.kp-card p{margin:6px 0 0; font-size:14px; line-height:1.75; color:var(--ink-2)}

/* case question extras */
.cmds{display:flex; flex-direction:column; gap:4px; margin:14px 0 0; padding:14px 16px; background:#FBF9F4; border:1px solid var(--line-2); border-radius:10px; font-family:var(--font-mono); font-size:13px; overflow-x:auto}
.cmds span{white-space:pre; color:var(--ink-2)}
.cmds span i{color:var(--accent); font-style:normal; margin-right:8px}
.tables{display:grid; gap:14px; margin-top:18px}
.tbl-cap{font-family:var(--font-mono); font-size:11px; color:var(--muted); letter-spacing:.06em; margin-bottom:6px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:520px; font-size:13px}
th,td{padding:7px 12px; text-align:right; border-bottom:1px solid var(--line-2); font-variant-numeric:tabular-nums; font-family:var(--font-mono); white-space:nowrap}
th{background:var(--paper-2); font-weight:500; color:var(--ink-2); font-size:11.5px; letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
.tbl-foot{padding:9px 12px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted); background:#FCFBF8; border-top:1px solid var(--line-2); line-height:1.8}
.parts{margin-top:20px; display:flex; flex-direction:column; gap:14px}
.part{border:1px solid var(--line-2); border-radius:10px; padding:14px 16px; background:#FDFCFA}
.part-q{margin:0 0 10px; font-size:14.5px; line-height:1.75}
.part-q b{font-family:var(--font-mono); color:var(--accent); font-weight:500; margin-right:6px}
.part .fill-row input{max-width:260px}
.part-fb{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:14px; line-height:1.8}
.part-fb .v{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase}
.part-fb.ok .v{color:var(--ok)} .part-fb.no .v{color:var(--no)}
.part-fb .ans{font-family:var(--font-mono); font-size:12.5px; color:var(--muted); margin:2px 0 6px}
.part-fb p{margin:0 0 6px; color:var(--ink-2)}
.part-fb .kps{margin-top:8px}

/* math-ish inline formatting */
.fm{font-family:var(--font-mono); font-size:.94em; white-space:nowrap; color:var(--ink); background:#F4F1E9; border-radius:4px; padding:1px 4px}
.fm sub,.fm sup{font-size:.72em}
.stem .fm,.opt .t .fm{background:#F4F1E9}

/* footer */
.foot{margin-top:44px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

/* toast */
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); background:var(--ink); color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:.24s; z-index:60}
.toast.on{opacity:1; transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px 72px}
  .mast{grid-template-columns:1fr; align-items:start}
  .mast-meta{text-align:left}
  .chead{grid-template-columns:1fr; gap:8px}
  .cno{font-size:44px}
  .q-head{grid-template-columns:40px 1fr}
  .q-body,.fb{padding-left:14px; padding-right:14px}
  .q-gutter{padding:14px 0}
  .judge{flex-direction:column}
  .judge .opt{max-width:none}
  .bar{margin:0 -14px; padding:10px 14px}
  .opt{grid-template-columns:22px 1fr; padding:10px 11px}
  .why li{grid-template-columns:20px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow">Econometrics · Chapter Quiz</div>
      <h1>计量经济学 <em>章节测试答题本</em></h1>
      <p>依据《计量经济学 章节测试 题目与答案》整理，共 6 章 88 题。答对给出完整解析与其余选项的辨析，答错指出所选项错在哪里，并附上本题涉及的知识点（参照李子奈、潘文卿《计量经济学》第五版）。</p>
    </div>
    <div class="mast-meta">
      <b id="globalScore">0<small style="font-size:13px;font-family:var(--font-mono)"> / 600</small></b>
      累计得分（各题按原始分值）
    </div>
  </header>

  <nav class="bar" aria-label="章节导航">
    <div class="chips" id="chips"></div>
    <div class="bar-actions">
      <button class="btn" id="btnReveal" type="button">查看本章答案</button>
      <button class="btn" id="btnReset" type="button">重置本章</button>
    </div>
  </nav>

  <main id="main" aria-live="polite"></main>

  <footer class="foot">
    <span>题库来源：超星学习通《计量经济学 章节测试》；知识点参照李子奈、潘文卿《计量经济学》第五版。</span>
    <span id="footStat"></span>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
window.__CH = [];
window.CH_ADD = function (ch) { window.__CH.push(ch); };
</script>

<script>
/* 知识点库：每条对应教材（李子奈、潘文卿《计量经济学》第五版）章节与要点 */
window.KB = {
  branch: {t:'计量经济学的学科归属', ref:'第1章 绪论', d:'计量经济学以经济学理论为依据、以经济数据为对象，用数学与统计方法定量刻画经济关系，学科上属于经济学的一个分支。'},
  econometrica: {t:'成为独立学科的标志', ref:'第1章 绪论', d:'1930年世界计量经济学会成立、1933年会刊《Econometrica》（《计量经济学》）创刊，被视为计量经济学成为独立学科的标志。'},
  threeSubjects: {t:'三大学科基础', ref:'第1章 绪论', d:'计量经济学是经济学、统计学（数理统计）、数学三者的结合：经济学提供理论与假设，统计学提供推断方法，数学提供模型形式与推导工具。'},
  randomness: {t:'被解释变量的随机性', ref:'第2章 一元线性回归模型', d:'模型中除解释变量外还包含随机误差项，被解释变量因此是随机变量；解释变量一般视为非随机（确定性）变量。'},
  dataTypes: {t:'三类数据', ref:'第1章 绪论 · 数据类型', d:'横截面数据：同一时点上不同单位同一指标；时间序列数据：同一单位不同时点；面板数据：不同单位、不同时点的二维数据。'},
  panel: {t:'面板数据', ref:'第1章 绪论 · 数据类型', d:'面板数据同时具有截面（个体）与时间（时序）两个维度，是"多个单位 × 多个时期"的二维数据。'},
  dataSource: {t:'数据来源与可用性', ref:'第1章 绪论 · 数据', d:'可用数据包括官方统计数据、专门调查数据（如CFPS）、以及把定性因素量化为虚拟变量的数据；计算机随机生成的数据不反映真实经济关系，不能用于实证分析。'},
  quality: {t:'数据质量的评价维度', ref:'第1章 绪论 · 数据质量', d:'评价样本数据质量主要看完整性、准确性、可比性（一致性）等；"多样性"不是数据质量的评价指标。'},
  testTypes: {t:'四类检验', ref:'第1章 绪论 · 建模步骤', d:'模型检验包括经济意义检验、统计检验、计量经济学检验、模型预测检验四个层次，各自回答不同问题。'},
  econTest: {t:'经济意义检验', ref:'第1章 绪论', d:'检验参数估计值的符号、大小、相互关系是否符合经济理论预期与经验判断，这是第一道也是最基础的检验。'},
  statTest: {t:'统计检验', ref:'第1章 绪论 / 第2章', d:'依据统计推断原理检验模型与参数的统计可靠性：拟合优度检验、变量显著性检验（t）、方程显著性检验（F）。'},
  econoTest: {t:'计量经济学检验', ref:'第1章 绪论', d:'检验模型是否满足计量经济学基本假定，包括多重共线性、异方差性、序列相关性、随机解释变量（内生性）等。'},

   k:['spurious','cointegration']},

  {id:'6-14', type:'judge', score:6.3,
   stem:'当两个时间序列都是二阶单整 I(2) 时，一定可以建立误差修正模型。',
   options:[
    {k:'A', t:'对', why:'把"同阶单整"误当成"协整"，跳过了必要的前提检验。'},
    {k:'B', t:'错', why:'正确判断。ECM 的前提是存在协整关系，同阶单整只是必要条件。'}],
   answer:['B'],
   analysis:'误差修正模型刻画"长期均衡 + 短期调整"，其存在前提是变量之间存在协整关系。同阶单整只是做协整检验的前提条件，并不保证协整成立；若检验发现无协整，就不能建立 ECM（否则误差修正项无意义）。',
   k:['ecm','cointegration']},

  {id:'6-15', type:'judge', score:6.3,
   stem:'检验随机误差项是否存在高阶序列相关，可以采用的方法包括图示法、DW 检验和 LM 检验。',
   options:[
    {k:'A', t:'对', why:'错在把 DW 检验也包括进来：DW 只能检验一阶自相关。'},
    {k:'B', t:'错', why:'正确判断。高阶自相关应用 LM（Breusch-Godfrey）检验，DW 不适用。'}],
   answer:['B'],
   analysis:'DW 统计量的构造只涉及相邻两期残差 e_t 与 e_{t−1}，因此只能检验一阶自相关，无法识别高阶（如二阶、四阶）自相关。检验高阶自相关的标准方法是 Breusch-Godfrey LM 检验（也可配合残差自相关图判断）。原题把 DW 列入高阶检验手段，故该说法错误。',
   k:['lmTest','dw','autocorr']},

  {id:'6-16', type:'fill2', score:6.3,
   stem:'如果一个时间序列的均值、方差和自协方差都不随时间推移而变化，则称该时间序列是＿＿(1)＿＿时间序列；若时间序列存在单位根，则该序列通常是＿＿(2)＿＿的。',
   options:[],
   blanks:[
    {label:'(1)', answer:['平稳'], accept:['平稳','平稳时间序列','stationary']},
    {label:'(2)', answer:['非平稳'], accept:['非平稳','非平稳序列','nonstationary']}
   ],
   analysis:'平稳（宽平稳）的定义就是均值、方差为常数且自协方差只与时间间隔有关。含单位根的序列（如随机游走 Y_t = Y_{t−1} + ε_t）方差随 t 增大而无界增长，故是非平稳序列，需差分后才能平稳。',
   k:['unitRoot','adf']}
  ]
});
</script>
<script>
/* ---------------- 应用逻辑 ---------------- */
(function(){
  'use strict';
  var CH = window.__CH || [];
  var KB = window.KB || {};
  var TYPE_LABEL = {single:'单选题', multi:'多选题', judge:'判断题', fill:'填空题', fill2:'填空题', case:'综合分录题'};
  var JUDGE_OPTS = [{k:'A',t:'对'},{k:'B',t:'错'}];

  // ---- 状态 ----
  var LS_KEY = 'econo-quiz-v1';
  var state = {cur:0, ans:{}, revealed:{}};
  function load(){
    try{
      var raw = window.localStorage.getItem(LS_KEY);
      if(raw){ var o = JSON.parse(raw); if(o && typeof o==='object'){ state.ans=o.ans||{}; state.revealed=o.revealed||{}; if(typeof o.cur==='number') state.cur=o.cur; } }
    }catch(e){}
  }
  function save(){
    try{ window.localStorage.setItem(LS_KEY, JSON.stringify({ans:state.ans, revealed:state.revealed, cur:state.cur})); }catch(e){}
  }

  // ---- 工具 ----
  function $(sel,root){ return (root||document).querySelector(sel); }
  function el(tag, cls, html){ var d=document.createElement(tag); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; }
  function norm(s){
    return String(s==null?'':s).replace(/[\s\u3000]/g,'')
      .replace(/[，。、；：？！（）【】“”‘’]/g,function(c){return {'，':',','。':'.','、':',','；':';','：':':','？':'?','！':'!','（':'(','）':')','【':'[','】':']','“':'"','”':'"','‘':"'",'’':"'"}[c]||c;})
      .toLowerCase();
  }
  function eqKey(a,b){ return a.slice().sort().join('') === b.slice().sort().join(''); }
  function scoreOf(q){ return q.score||0; }
  function chapterMax(ch){ return ch.questions.reduce(function(s,q){return s+scoreOf(q);},0); }
  function totalMax(){ return CH.reduce(function(s,c){return s+chapterMax(c);},0); }
  function round(n){ return Math.round(n*10)/10; }

  // ---- 判分 ----
  function grade(q, a){
    if(!a) return false;
    if(q.type==='single' || q.type==='judge') return a.picked && a.picked.length===1 && q.answer.indexOf(a.picked[0])>=0;
    if(q.type==='multi') return a.picked && a.picked.length>0 && eqKey(a.picked, q.answer);
    if(q.type==='fill') return q.accept ? q.accept.some(function(x){return norm(x)===norm(a.value);}) : norm(q.answer[0])===norm(a.value);
    if(q.type==='fill2') return q.blanks.every(function(b,i){ var v=(a.blanks||[])[i]; return v && b.accept.some(function(x){return norm(x)===norm(v);}); });
    if(q.type==='case') return q.parts.every(function(p,i){ var v=(a.parts||[])[i]; return v && p.accept.some(function(x){return norm(x)===norm(v);}); });
    return false;
  }
  function partRight(p, v){ return v && p.accept.some(function(x){return norm(x)===norm(v);}); }
  function answered(q){ var a=state.ans[q.id]; if(!a) return false; if(q.type==='case') return (a.parts||[]).some(function(x){return x;}); return true; }
  function isRevealed(ch, q){ return !!state.revealed[q.id]; }

  // ---- 顶部导航 ----
  function renderChips(){
    var box=$('#chips'); box.innerHTML='';
    CH.forEach(function(ch,i){
      var b=el('button','chip');
      b.type='button'; b.setAttribute('aria-pressed', i===state.cur?'true':'false');
      b.innerHTML='<span class="n">'+ch.no+'</span>'+ch.title;
      b.addEventListener('click', function(){ state.cur=i; save(); renderChips(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
      box.appendChild(b);
    });
  }
  function renderGlobal(){
    var total=0;
    CH.forEach(function(ch){ ch.questions.forEach(function(q){ if(grade(q,state.ans[q.id])) total+=scoreOf(q); }); });
    var max=totalMax();
    $('#globalScore').innerHTML = round(total)+'<small style="font-size:13px;font-family:var(--font-mono)"> / '+max+'</small>';
    var nAll=0, nAns=0;
    CH.forEach(function(ch){ ch.questions.forEach(function(q){ nAll++; if(answered(q)) nAns++; }); });
    $('#footStat').textContent = '已作答 '+nAns+' / '+nAll+' 题';
  }

  // ---- 反馈渲染 ----
  function kpsOf(q){
    var box=el('div','kps');
    (q.k||[]).forEach(function(id){
      var info=KB[id]; if(!info) return;
      var b=el('button','kp'); b.type='button'; b.textContent=info.t;
      var doc=el('div','kp-doc');
      b.addEventListener('click', function(){
        var open=b.getAttribute('aria-expanded')==='true';
        b.setAttribute('aria-expanded', open?'false':'true');
        doc.innerHTML='';
        if(!open){
          var c=el('div','kp-card');
          c.innerHTML='<h5>'+info.t+'</h5><div class="ref">'+info.ref+'</div><p>'+info.d+'</p>';
          doc.appendChild(c);
        }
      });
      box.appendChild(b);
      box.__doc = box.__doc || doc;
    });
    var wrap=el('div');
    wrap.appendChild(box);
    if(box.__doc) wrap.appendChild(box.__doc);
    return wrap;
  }

  function feedback(q, a, opts){
    var ok = grade(q,a);
    var fb = el('div','fb '+(ok?'ok':'no'));
    var g = el('div','fb-verdict');
    g.innerHTML = ok ? '<span class="ic">✓</span>回答正确' : '<span class="ic">✕</span>回答错误';
    fb.appendChild(g);

    var keyTxt = '';
    if(q.type==='fill') keyTxt = q.answer[0];
    else if(q.type==='fill2') keyTxt = q.blanks.map(function(b,i){return '('+(i+1)+') '+b.answer[0];}).join('；');
    else if(q.type==='case') keyTxt = '见下方各小题';
    else keyTxt = q.answer.join('、');
    var kline=el('div','fb-key','正确答案：<b>'+keyTxt+'</b>');
    fb.appendChild(kline);

    // 解析
    var b1=el('div','fb-block'); b1.appendChild(el('h4',null,'解析'));
    b1.appendChild(el('p',null,q.analysis||''));
    fb.appendChild(b1);

    // 选项辨析
    var list = (q.type==='judge') ? JUDGE_OPTS : (q.options||[]);
    if(list.length){
      var b2=el('div','fb-block');
      b2.appendChild(el('h4',null, ok?'其余选项为什么错':'错在哪里 · 各选项辨析'));
      var ul=el('ul','why');
      list.forEach(function(o){
        var isRight = q.answer.indexOf(o.k)>=0;
        var picked = a && a.picked && a.picked.indexOf(o.k)>=0;
        var li=el('li', isRight?'is-right':(picked?'is-wrong':''));
        var tag = isRight ? '<em class="g">正确答案</em>' : (picked ? '<em>你的选择</em>' : '');
        li.innerHTML='<span class="kk">'+o.k+'</span><span><b>'+o.t+'</b>'+tag+'<br>'+(o.why||'')+'</span>';
        ul.appendChild(li);
      });
      b2.appendChild(ul);
      fb.appendChild(b2);
    }

    // 知识点
    if((q.k||[]).length){
      var b3=el('div','fb-block');
      b3.appendChild(el('h4',null,'本题涉及的知识点'));
      b3.appendChild(kpsOf(q));
      fb.appendChild(b3);
    }
    if(opts && opts.partial){ fb.dataset.partial='1'; }
    return fb;
  }

  // ---- 题目卡片 ----
  function qCard(ch, q, idx){
    var card=el('article','q'); card.id='q-'+q.id;
    var head=el('div','q-head');
    var gut=el('div','q-gutter');
    gut.appendChild(el('div','num', String(idx+1).padStart(2,'0')));
    var mk=el('div','mk'); gut.appendChild(mk);
    head.appendChild(gut);

    var body=el('div','q-body');
    var meta=el('div','q-meta');
    meta.appendChild(el('span','tag type', TYPE_LABEL[q.type]||'题目'));
    meta.appendChild(el('span','tag pt', scoreOf(q)+' 分'));
    body.appendChild(meta);
    body.appendChild(el('div','stem', q.stem));

    var a = state.ans[q.id];
    var done = answered(q) && (q.type!=='case');
    var revealed = isRevealed(ch,q);

    if(q.type==='case'){
      renderCase(body, q, a, revealed);
    } else if(q.type==='single' || q.type==='multi' || q.type==='judge'){
      var opts = (q.type==='judge') ? JUDGE_OPTS : q.options;
      var multi = q.type==='multi';
      var ul=el('ul','opts'+(q.type==='judge'?' judge':''));
      var sel = (a && a.picked) ? a.picked.slice() : [];
      opts.forEach(function(o){
        var b=el('button','opt'); b.type='button';
        b.innerHTML='<span class="k">'+o.k+'</span><span class="t">'+o.t+'</span>';
        if(done || revealed){
          b.disabled=true;
          if(q.answer.indexOf(o.k)>=0) b.classList.add('right');
          if(sel.indexOf(o.k)>=0 && q.answer.indexOf(o.k)<0) b.classList.add('wrong');
          if(q.answer.indexOf(o.k)<0 && sel.indexOf(o.k)<0) b.classList.add('dim');
        } else {
          if(sel.indexOf(o.k)>=0) b.classList.add('sel');
          b.addEventListener('click', function(){
            if(multi){
              var i=sel.indexOf(o.k);
              if(i>=0) sel.splice(i,1); else sel.push(o.k);
              b.classList.toggle('sel');
              return;
            }
            state.ans[q.id]={picked:[o.k]};
            save(); render(); renderGlobal();
          });
        }
        ul.appendChild(b);
      });
      body.appendChild(ul);
      if(multi && !done && !revealed){
        var act=el('div','act');
        var btn=el('button','btn primary','提交本题'); btn.type='button';
        btn.addEventListener('click', function(){
          if(!sel.length){ toast('请至少选择一项'); return; }
          state.ans[q.id]={picked:sel.slice()}; save(); render(); renderGlobal();
        });
        act.appendChild(btn);
        act.appendChild(el('span','note','多选题：全部选对才计分'));
        body.appendChild(act);
      }
    } else if(q.type==='fill' || q.type==='fill2'){
      renderFill(body, q, a, done||revealed, revealed);
    }

    head.appendChild(body);
    card.appendChild(head);

    // 反馈区
    if(q.type!=='case' && (done || revealed)){
      var fb=feedback(q, a);
      if(revealed && !grade(q,a)){ fb.classList.remove('ok'); fb.classList.add('no'); }
      card.appendChild(fb);
      mk.classList.add(grade(q,a)?'ok':'no');
      mk.textContent = grade(q,a)?'✓':'✕';
    } else if(q.type==='case' && (done || revealed)){
      mk.textContent='·';
    }
    if(revealed && !grade(q,a)){ mk.classList.add('no'); mk.textContent='✕'; }
    return card;
  }

  function renderFill(body, q, a, done, revealed){
    var blanks = (q.type==='fill2') ? q.blanks : [{label:'',answer:q.answer,accept:q.accept}];
    var box=el('div','fills');
    var inputs=[];
    blanks.forEach(function(b,i){
      var row=el('div','fill-row');
      if(b.label) row.appendChild(el('label',null,b.label));
      var inp=document.createElement('input');
      inp.type='text'; inp.placeholder='填写答案'; inp.autocomplete='off';
      inp.value = (a && ((a.blanks||[])[i] !== undefined ? a.blanks[i] : (i===0? (a.value||'') : ''))) || '';
      if(done) inp.disabled=true;
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
      inputs.push(inp); row.appendChild(inp);
      box.appendChild(row);
    });
    function submit(){
      var vals=inputs.map(function(x){return x.value;});
      if(vals.some(function(v){return !v.trim();})){ toast('请填写完整'); return; }
      if(q.type==='fill2'){ state.ans[q.id]={blanks:vals}; }
      else { state.ans[q.id]={value:vals[0], blanks:vals}; }
      save(); render(); renderGlobal();
    }
    if(!done){
      var act=el('div','act');
      var btn=el('button','btn primary','提交本题'); btn.type='button';
      btn.addEventListener('click', submit);
      act.appendChild(btn);
      act.appendChild(el('span','note', q.type==='fill2' ? '两空都答对才计分' : '允许同义表述，如"方差""方差σ²"'));
      box.appendChild(act);
    }
    body.appendChild(box);
  }

  function renderCase(body, q, a, revealed){
    if(q.commands){
      var cm=el('div','cmds');
      q.commands.forEach(function(c){ cm.appendChild(el('span',null,'<i>'+c[0]+'</i>'+c[1])); });
      body.appendChild(cm);
    }
    if(q.stem2) body.appendChild(el('p','hint',q.stem2));
    if(q.tables){
      var tw=el('div','tables');
      q.tables.forEach(function(t){
        var d=el('div');
        d.appendChild(el('div','tbl-cap',t.cap));
        var w=el('div','tbl-wrap');
        var html='<table><thead><tr>'+t.head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>';
        t.rows.forEach(function(r){ html+='<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>'; });
        html+='</tbody></table>';
        w.innerHTML=html;
        d.appendChild(w);
        d.appendChild(el('div','tbl-foot',t.foot));
        tw.appendChild(d);
      });
      body.appendChild(tw);
    }
    var parts=el('div','parts');
    q.parts.forEach(function(p,i){
      var wrap=el('div','part');
      wrap.appendChild(el('p','part-q','<b>'+p.n+'</b>'+p.stem));
      var val=(a&&a.parts)?a.parts[i]:'';
      var row=el('div','fill-row');
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder='填写答案'; inp.autocomplete='off'; inp.value=val||'';
      var submitted = !!(a&&a.parts&&a.parts[i]);
      if(submitted||revealed) inp.disabled=true;
      row.appendChild(inp);
      var btn=el('button','btn','提交'); btn.type='button';
      function sub(){
        if(!inp.value.trim()){ toast('请填写答案'); return; }
        var arr=(state.ans[q.id]&&state.ans[q.id].parts)?state.ans[q.id].parts.slice():new Array(q.parts.length).fill('');
        arr[i]=inp.value; state.ans[q.id]={parts:arr};
        save(); render(); renderGlobal();
      }
      btn.addEventListener('click',sub);
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') sub(); });
      if(!submitted && !revealed) row.appendChild(btn);
      wrap.appendChild(row);

      if(submitted || revealed){
        var right=partRight(p, val);
        var f=el('div','part-fb '+(right?'ok':'no'));
        f.appendChild(el('div','v', right?'✓ 正确':'✕ 错误'));
        f.appendChild(el('div','ans','参考答案：'+p.answer[0]));
        f.appendChild(el('p',null,p.analysis));
        if((p.k||[]).length) f.appendChild(kpsOf(p));
        wrap.appendChild(f);
      }
      parts.appendChild(wrap);
    });
    body.appendChild(parts);
  }

  // ---- 主渲染 ----
  function render(){
    var ch=CH[state.cur];
    var main=$('#main'); main.innerHTML='';
    if(!ch) return;

    var head=el('section','chead');
    var left=el('div'); left.appendChild(el('div','cno', ch.no)); 
    var right=el('div');
    right.appendChild(el('h2',null,ch.title));
    right.appendChild(el('p','sub', ch.note));
    var sl=el('div','scoreline');
    var got=0, cnt=0;
    ch.questions.forEach(function(q){ if(grade(q,state.ans[q.id])) got+=scoreOf(q); cnt++; });
    sl.innerHTML='<div><b>'+round(got)+'</b><span>/ '+chapterMax(ch)+' 分</span></div>'
      +'<div><b>'+cnt+'</b><span>题</span></div>'
      +'<div><b>'+ch.questions.filter(function(q){return grade(q,state.ans[q.id]);}).length+'</b><span>已答对</span></div>'
      +'<div><b style="font-size:14px;font-family:var(--font-body)">'+ch.raw+'</b></div>';
    right.appendChild(sl);
    var m=el('div','meter'); var i=el('i'); m.appendChild(i); right.appendChild(m);
    head.appendChild(left); head.appendChild(right);
    main.appendChild(head);

    ch.questions.forEach(function(q,idx){ main.appendChild(qCard(ch,q,idx)); });
    requestAnimationFrame(function(){ i.style.width=Math.min(100, got/chapterMax(ch)*100)+'%'; });

    $('#btnReveal').textContent = ch.questions.every(function(q){return isRevealed(ch,q);}) ? '收起本章答案' : '查看本章答案';
    save(); renderGlobal();
  }

  var toastT;
  function toast(msg){
    var t=$('#toast'); t.textContent=msg; t.classList.add('on');
    clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); },1800);
  }

  // ---- 顶栏动作 ----
  function bindBar(){
    $('#btnReveal').addEventListener('click', function(){
      var ch=CH[state.cur];
      var all=ch.questions.every(function(q){return isRevealed(ch,q);});
      ch.questions.forEach(function(q){ if(all) delete state.revealed[q.id]; else state.revealed[q.id]=1; });
      save(); render();
      toast(all?'已收起答案':'已展开本章答案，未作答的题不计分');
    });
    $('#btnReset').addEventListener('click', function(){
      var ch=CH[state.cur];
      ch.questions.forEach(function(q){ delete state.ans[q.id]; delete state.revealed[q.id]; });
      save(); render(); toast('已重置本章作答记录');
    });
  }

  load(); renderChips(); bindBar(); render();
})();
</script>
</body>
</html>
